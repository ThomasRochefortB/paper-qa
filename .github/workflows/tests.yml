name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  PQA_HOME: ${{ github.workspace }}/.paperqa-test-home

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        python-version: [3.11, 3.12] # Our min and max supported Python versions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # For setuptools-scm, replace with fetch-tags after https://github.com/actions/checkout/issues/1471
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11] # Our min supported Python version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv python pin ${{ matrix.python-version }}
      - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2
      - run: uv sync --locked --python-preference=only-managed
      - run: uv run refurb paperqa tests
      - run: uv run pylint paperqa
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12] # Our min and max supported Python versions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv python pin ${{ matrix.python-version }}
      - run: uv sync --locked --python-preference=only-managed
      - name: Cache datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface/datasets
          key: ${{ runner.os }}-datasets-${{ hashFiles('paperqa') }}
          restore-keys: ${{ runner.os }}-datasets-
      - run: uv run pytest -n auto --record-mode=none
        env:
          OPENAI_API_KEY: offline-test-key
          ANTHROPIC_API_KEY: offline-test-key
          SEMANTIC_SCHOLAR_API_KEY: offline-test-key
          CROSSREF_API_KEY: offline-test-key
