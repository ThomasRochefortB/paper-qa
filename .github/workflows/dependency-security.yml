name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "39 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit all locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.0"
      - name: Export every dependency group and extra without installing them
        run: uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Check known advisories without installing project dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --strict
  compatibility:
    name: Offline core compatibility
    needs: audit
    runs-on: ubuntu-latest
    env:
      PQA_HOME: ${{ github.workspace }}/.paperqa-test-home
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.0"
      - run: uv sync --locked --no-dev --extra security-test
      - run: uv run --locked --no-dev --extra security-test pytest tests/test_configs.py tests/test_security_compatibility.py --record-mode=none
